CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610_ALT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# VCC on the nice!nano stays on while the board is awake.
# Deep sleep is off: with no key, nothing could wake the sensor after power-off.
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=n

CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
